name: Security Gatekeeper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gatekeeper:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Install dependencies
        run: uv sync

      - name: Run Gatekeeper scan
        run: uv run python gatekeeper.py scan --target .
